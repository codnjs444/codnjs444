name: Update README with Recent Commits

on:
  schedule:
    - cron: "0 0 * * *" # 매일 자정 실행
  workflow_dispatch: # 수동 실행 가능

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Fetch Recent Commits
        run: |
          echo "## 📈 최근 커밋 내역" > recent-commits.md
          echo "(자동으로 업데이트됩니다)" >> recent-commits.md
          git log --pretty=format:"- %s (%h)" -n 5 >> recent-commits.md

      - name: Update README
        run: |
          sed -i '/## 📈 최근 커밋 내역/,$d' README.md
          cat recent-commits.md >> README.md

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README with recent commits"
          git push
